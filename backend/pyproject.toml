[project]
name = "scorescan-backend"
version = "1.0.0"
description = "ScoreScan backend: image/PDF to MusicXML conversion service"
requires-python = ">=3.12,<3.13"
dependencies = [
    # FastAPI and server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    # Database
    # Held below 2.1 until tested; see the 2.1 migration notes
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14",
    # Authentication
    "passlib>=1.7",
    # passlib 1.7.x has a warning regression against bcrypt 5.x; cap below 5
    "bcrypt>=4.0,<5",
    # Rate limiting
    "slowapi>=0.1.9",
    # Async task queue
    "celery>=5.3",
    # Celery 5.x requires redis<7
    "redis>=5,<7",
    # Music processing
    # music21 10 is a major release; hold until transposition is re-tested
    "music21>=9.1,<10",
    # Image processing for OMR preprocessing
    # OpenCV 5 is a major release; hold until preprocessing is re-tested
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    # Utilities
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "Pillow>=11",
    "aiofiles>=23.2",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
]
# Deep-learning OMR fallback. Heavy (TensorFlow + ~500MB model weights) so it
# lives in its own group — the worker Docker image installs it by default, the
# API Docker image does not. Local devs can skip it with `uv sync` (no flag)
# or include it with `uv sync --group oemer`.
oemer = [
    "oemer>=0.1.7",
    # onnxruntime >= 1.28 rejects oemer 0.1.8's models at load time
    # ("ConvTranspose ... pads must not contain negative values")
    "onnxruntime-gpu<1.27",
]

[tool.uv]
package = false
