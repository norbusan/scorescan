[project]
name = "scorescan-backend"
version = "1.0.0"
description = "ScoreScan backend: image/PDF to MusicXML conversion service"
requires-python = ">=3.12,<3.13"
dependencies = [
    # FastAPI and server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # Authentication
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7",
    # passlib 1.7.x has a warning regression against bcrypt 5.x; cap below 5
    "bcrypt>=4.0,<5",
    # Rate limiting
    "slowapi>=0.1.9",
    # Async task queue
    "celery>=5.3",
    # Celery 5.x requires redis<7
    "redis>=5,<7",
    # Music processing
    "music21>=9.1",
    # Image processing for OMR preprocessing
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    # Utilities
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "Pillow>=11",
    "aiofiles>=23.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
]

[tool.uv]
package = false
